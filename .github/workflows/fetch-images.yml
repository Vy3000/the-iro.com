# One-off helper: copies the photos from Wix into the repository.
# Runs when this file is first pushed, or manually from the Actions tab.
name: Fetch images from Wix

on:
  workflow_dispatch:
  push:
    paths: [".github/workflows/fetch-images.yml", "get-images.sh"]

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash get-images.sh
      - run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add assets
          git diff --cached --quiet || git commit -m "Add photos from Wix site"
          git push
