name: Make logo (draft branch only)
on:
  push:
    branches: [sleep-page]
    paths: [tools/make-logo.py, .github/workflows/make-logo.yml]
permissions:
  contents: write
jobs:
  logo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install pillow && python3 tools/make-logo.py
      - run: |
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add assets/img/logo-the-iro.png
          git diff --cached --quiet || git commit -m "Add The IRO logo lettering"
          git push
